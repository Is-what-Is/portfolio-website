name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # "/portfolio-website/" on github.io, "/" once a custom domain is set.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Assemble site
        run: |
          # Prerendered HTML is written under the base path; lift it to the root.
          sub="build/client${{ steps.pages.outputs.base_path }}"
          if [ "$sub" != "build/client" ] && [ -d "$sub" ]; then
            cp -R "$sub"/. build/client/
            rm -rf "$sub"
          fi
          # GitHub Pages serves 404.html for unknown addresses.
          cp build/client/__spa-fallback.html build/client/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
